openapi: 3.0.3

info:
  title: Manya's Closet — REST API
  version: 1.0.0
  description: |
    Full e-commerce REST API for **Manya's Closet** — a fashion store built with
    Node.js, Express, MongoDB, and TypeScript.


    The API uses **HTTP-only cookies** (`accessToken` + `refreshToken`) set on login.
    Alternatively send `Authorization: Bearer <token>` in the request header.


    - `user` — registered customer
    - `admin` — store administrator (full access)


    - `/api/auth/*` → 20 req / 15 min
    - All other routes → 200 req / 1 min

  contact:
    name: API Support
    email: admin@manyascloset.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: https://api.manyascloset.com/api
    description: Production

tags:
  - name: Auth
    description: Registration, login, logout, OAuth, password reset
  - name: Products
    description: Product catalogue, search, CRUD (admin)
  - name: Reviews
    description: Product reviews — add, edit, delete
  - name: Categories
    description: Product categories
  - name: Cart
    description: Shopping cart — guest merge supported
  - name: Orders
    description: Order lifecycle — create, pay, track, cancel
  - name: Wishlist
    description: User wishlist — guest sync supported
  - name: Coupons
    description: Discount codes — validate and manage (admin)
  - name: Users
    description: User profile, addresses
  - name: Admin
    description: Admin-only analytics and management endpoints
  - name: Webhooks
    description: Payment provider webhooks
  - name: Newsletter
    description: Email newsletter subscription




components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HTTP-only cookie set on login
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:


    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Resource not found

    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        totalPages:
          type: integer
          example: 10


    Address:
      type: object
      required: [fullName, phone, addressLine1, city, state, pincode]
      properties:
        _id:
          type: string
          example: 66a1f2b3c4d5e6f7a8b9c0d1
        label:
          type: string
          example: Home
        fullName:
          type: string
          example: Manya Sharma
        phone:
          type: string
          example: "9876543210"
        addressLine1:
          type: string
          example: 42 MG Road
        addressLine2:
          type: string
          example: Near City Mall
        city:
          type: string
          example: Bengaluru
        state:
          type: string
          example: Karnataka
        pincode:
          type: string
          example: "560001"
        country:
          type: string
          default: India
        isDefault:
          type: boolean
          default: false

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Manya Sharma
        email:
          type: string
          format: email
          example: manya@example.com
        avatar:
          type: string
          format: uri
        role:
          type: string
          enum: [user, admin]
        isVerified:
          type: boolean
        isBlocked:
          type: boolean
        googleId:
          type: string
        savedAddresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductVariant:
      type: object
      required: [size, color, stock, sku]
      properties:
        _id:
          type: string
        size:
          type: string
          example: M
        color:
          type: string
          example: black
        stock:
          type: integer
          minimum: 0
          example: 25
        sku:
          type: string
          example: FWD-BLK-M

    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Floral Wrap Dress
        slug:
          type: string
          example: floral-wrap-dress
        description:
          type: string
        price:
          type: number
          example: 2499
        discountPrice:
          type: number
          example: 1999
        images:
          type: array
          items:
            type: string
            format: uri
        category:
          type: string
          example: dresses
        brand:
          type: string
          example: Zara
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        ratings:
          type: number
          minimum: 0
          maximum: 5
          example: 4.3
        reviewCount:
          type: integer
          example: 17
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        _id:
          type: string
        product:
          oneOf:
            - type: string
              description: Product ObjectId
            - $ref: '#/components/schemas/Product'
        name:
          type: string
        image:
          type: string
          format: uri
        price:
          type: number
        quantity:
          type: integer
          minimum: 1
        size:
          type: string
        color:
          type: string

    Cart:
      type: object
      properties:
        _id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number

    OrderItem:
      type: object
      properties:
        product:
          type: string
          description: Product ObjectId
        name:
          type: string
        image:
          type: string
        price:
          type: number
        quantity:
          type: integer
        size:
          type: string
        color:
          type: string

    Order:
      type: object
      properties:
        _id:
          type: string
        user:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        deliveryOption:
          type: string
          enum: [standard, express, sameday]
        subtotal:
          type: number
        shippingCharge:
          type: number
        discount:
          type: number
        total:
          type: number
        couponCode:
          type: string
        paymentMethod:
          type: string
          enum: [razorpay, cod]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        razorpayOrderId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled, refunded]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        _id:
          type: string
        product:
          type: string
        user:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        comment:
          type: string
          example: Great quality and fast delivery!
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Dresses
        slug:
          type: string
          example: dresses
        description:
          type: string
        image:
          type: string
          format: uri
        parent:
          type: string
          nullable: true
        sortOrder:
          type: integer
        isActive:
          type: boolean
        productCount:
          type: integer

    Coupon:
      type: object
      properties:
        _id:
          type: string
        code:
          type: string
          example: SUMMER25
        type:
          type: string
          enum: [percentage, flat]
        value:
          type: number
          example: 25
        minOrderAmount:
          type: number
          example: 999
        maxDiscount:
          type: number
          description: Maximum discount cap for percentage coupons
          example: 500
        maxUses:
          type: integer
          example: 1000
        usedCount:
          type: integer
          example: 47
        expiresAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time




paths:





  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Manya Sharma
                email:
                  type: string
                  format: email
                  example: manya@example.com
                password:
                  type: string
                  minLength: 8
                  example: Secret@2025
      responses:
        '201':
          description: Registered — auth cookies set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          description: Validation error or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful — `accessToken` and `refreshToken` cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=eyJhbGc...; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout — clears auth cookies and invalidates refresh token
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Issue a new access token using the refresh token cookie
      responses:
        '200':
          description: New access token set in cookie
        '401':
          description: Missing, invalid, or expired refresh token

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /auth/google:
    get:
      tags: [Auth]
      summary: Initiate Google OAuth 2.0 login
      responses:
        '302':
          description: Redirect to Google consent screen

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback — sets auth cookies and redirects to client
      responses:
        '302':
          description: Redirects to client URL with auth cookies set

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password reset link to the given email
      description: Always returns 200 even if the email is not registered (prevents enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (if account exists)

  /auth/reset-password/{token}:
    post:
      tags: [Auth]
      summary: Reset password using the token received in email
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Raw (un-hashed) reset token from the email link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Token invalid or expired





  /products:
    get:
      tags: [Products]
      summary: List products with filtering, sorting, and pagination
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Comma-separated category slugs (e.g. `dresses,tops`)
        - name: brand
          in: query
          schema:
            type: string
          description: Comma-separated brand names
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: size
          in: query
          schema:
            type: string
          example: M
        - name: color
          in: query
          schema:
            type: string
          example: black
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search across name, description, brand
        - name: isFeatured
          in: query
          schema:
            type: boolean
        - name: sale
          in: query
          schema:
            type: boolean
          description: Filter products with a discount price
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 5
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, newest, popular]
          default: newest
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            maximum: 50
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [Products]
      summary: Create a product (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, category]
              properties:
                name:
                  type: string
                  example: Floral Wrap Dress
                description:
                  type: string
                price:
                  type: number
                  minimum: 0
                  example: 2499
                discountPrice:
                  type: number
                  example: 1999
                category:
                  type: string
                  example: dresses
                brand:
                  type: string
                  example: Zara
                images:
                  type: array
                  items:
                    type: string
                    format: uri
                variants:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProductVariant'
                isFeatured:
                  type: boolean
                  default: false
                isActive:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — admin only

  /products/filters:
    get:
      tags: [Products]
      summary: Get available filter facets
      description: Returns distinct brands, categories, sizes, colors, and price range for the active product catalogue.
      responses:
        '200':
          description: Filter options
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      brands:
                        type: array
                        items:
                          type: string
                      categories:
                        type: array
                        items:
                          type: string
                      sizes:
                        type: array
                        items:
                          type: string
                      colors:
                        type: array
                        items:
                          type: string
                      price:
                        type: object
                        properties:
                          min:
                            type: number
                          max:
                            type: number

  /products/search/autocomplete:
    get:
      tags: [Products]
      summary: Search autocomplete suggestions
      description: Returns up to 8 product name suggestions matching the query using MongoDB full-text search.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          example: floral
      responses:
        '200':
          description: Autocomplete results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                        image:
                          type: string
                        price:
                          type: number

  /products/low-stock:
    get:
      tags: [Products]
      summary: Get products with low-stock variants (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            default: 5
          description: Variants with stock ≤ threshold are flagged
      responses:
        '200':
          description: Low-stock alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: string
                        name:
                          type: string
                        lowVariants:
                          type: array
                          items:
                            type: object
                            properties:
                              variantId:
                                type: string
                              size:
                                type: string
                              color:
                                type: string
                              sku:
                                type: string
                              stock:
                                type: integer

  /products/{slug}:
    get:
      tags: [Products]
      summary: Get a single product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: floral-wrap-dress
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Product'
        '404':
          description: Product not found

  /products/{id}:
    put:
      tags: [Products]
      summary: Update a product by ID (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Updated product
        '404':
          description: Product not found

    delete:
      tags: [Products]
      summary: Soft-delete a product — sets `isActive` to `false` (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deactivated

  /products/{id}/related:
    get:
      tags: [Products]
      summary: Get related products in the same category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related products (up to 6, sorted by rating)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /products/{id}/inventory:
    get:
      tags: [Products]
      summary: Get stock levels per variant (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Per-variant inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      productId:
                        type: string
                      name:
                        type: string
                      totalStock:
                        type: integer
                      inventory:
                        type: array
                        items:
                          type: object
                          properties:
                            variantId:
                              type: string
                            size:
                              type: string
                            color:
                              type: string
                            sku:
                              type: string
                            stock:
                              type: integer
                            status:
                              type: string
                              enum: [in_stock, low_stock, out_of_stock]

    patch:
      tags: [Products]
      summary: Bulk-update stock levels for variants (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [variantId, stock]
                    properties:
                      variantId:
                        type: string
                      stock:
                        type: integer
                        minimum: 0
      responses:
        '200':
          description: Updated variants





  /products/{productId}/reviews:
    get:
      tags: [Reviews]
      summary: Get all reviews for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reviews sorted newest-first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'

    post:
      tags: [Reviews]
      summary: Submit a review (must have a delivered order containing this product)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '201':
          description: Review created and product ratings recalculated
        '400':
          description: Already reviewed this product
        '403':
          description: Must have a delivered order to leave a review

  /products/{productId}/reviews/{reviewId}:
    put:
      tags: [Reviews]
      summary: Update own review
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Review updated
        '403':
          description: Not authorized to edit this review

    delete:
      tags: [Reviews]
      summary: Delete a review (own review or admin)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted and product ratings recalculated
        '403':
          description: Not authorized





  /categories:
    get:
      tags: [Categories]
