  /webhooks/razorpay:
    post:
      tags: [Webhooks]
      summary: Razorpay payment webhook
      description: |
        Handles the following Razorpay events:
        - `payment.captured` → sets order to `confirmed`, `paymentStatus` to `paid`
        - `payment.failed` → sets `paymentStatus` to `failed`
        - `order.paid` → sets order to `confirmed`, `paymentStatus` to `paid`

        **Signature verification**: HMAC-SHA256 over the raw request body using `RAZORPAY_WEBHOOK_SECRET`.
        The body must arrive as a raw Buffer (route uses `express.raw()` before global `express.json()`).
      parameters:
        - name: x-razorpay-signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC-SHA256 hex digest of the raw request body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: payment.captured
                payload:
                  type: object
      responses:
        '200':
          description: Webhook acknowledged
        '400':
          description: Missing or invalid signature





