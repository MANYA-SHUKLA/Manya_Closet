  /orders:
    get:
      tags: [Orders]
      summary: Get all orders — paginated (admin only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, shipped, delivered, cancelled, refunded]
        - name: paymentStatus
          in: query
          schema:
            type: string
            enum: [pending, paid, failed, refunded]
      responses:
        '200':
          description: Paginated order list

    post:
      tags: [Orders]
      summary: Create a new order from the user's current cart
      description: |
        Creates the order, decrements product stock, and clears the cart.

        **Razorpay** — returns `razorpayOrderId`, `razorpayKeyId`, and `amount` to initiate client-side payment.
        Payment must be confirmed via `POST /orders/verify-payment`.

        **COD** — order is immediately set to `confirmed` and a confirmation email is sent.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress:
                  $ref: '#/components/schemas/Address'
                deliveryOption:
                  type: string
                  enum: [standard, express, sameday]
                  default: standard
                couponCode:
                  type: string
                  example: SUMMER25
                paymentMethod:
                  type: string
                  enum: [razorpay, cod]
                  default: razorpay
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      order:
                        $ref: '#/components/schemas/Order'
                      razorpayOrderId:
                        type: string
                        description: Present only for Razorpay orders
                      key:
                        type: string
                        description: Razorpay public key ID
                      deliveryLabel:
                        type: string
                      estimatedDelivery:
                        type: string
                      appliedCoupon:
                        type: string
        '400':
          description: Cart is empty or stock unavailable

